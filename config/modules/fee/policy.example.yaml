# Central platform fee policy. Amount caps use canonical USD minor units.
parameters:
  # Master switch for all fees. Per-operation switches must also be enabled.
  enabled: true

  # Percentage accepts at most two decimal places; fee rounding is half up.
  withdrawal:
    enabled: true
    percentage: 5
    maximum_amount_minor: 2000

  # Applied to transfers from buyer funding balance into earnings. Both this
  # switch and the global switch must be true to charge the configured fee.
  funding_to_earning:
    enabled: true
    percentage: 2
    maximum_amount_minor: 1000

  # Applied to transfers from earnings into buyer funding balance.
  earning_to_funding:
    enabled: true
    percentage: 1
    maximum_amount_minor: 500
