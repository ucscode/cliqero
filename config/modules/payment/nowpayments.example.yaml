imports:

parameters:
  # NOWPayments standard API (sandbox: https://api-sandbox.nowpayments.io).
  # Copy to nowpayments.yaml locally. Set enabled=true only after filling secrets.
  enabled: false
  display_name: NOWPayments
  image_url: /images/payment/nowpayments.svg
  description: Pay through NOWPayments.
  config:
    # Server-side credentials; never commit the local file or expose these values.
    api_key: api_key_here
    ipn_secret: ipn_secret_here
    # Use the sandbox URL for acceptance testing; callback must be reachable by NOWPayments.
    api_base_url: https://api-sandbox.nowpayments.io
    # Set TUNNEL_URL to a public origin for local sandbox IPN delivery.
    ipn_callback_url: "%env(TUNNEL_URL)%/api/payments/nowpayments/ipn"
    # Allowlist of currencies customers may choose at funding time.
    pay_currencies:
      - usdttrc20
    # Optional NOWPayments sandbox simulation.
    # This does not switch the API to sandbox.
    # `api_base_url` must already be:
    #   https://api-sandbox.nowpayments.io
    #
    # Omit this section or set it to null to use the sandbox API normally
    # without forcing a simulated test case.
    #
    # Never configure this section with the production NOWPayments API.
    # sandbox:
    #   # success simulates the successful flow without a real crypto payment.
    #   case: success
  filters:
    # Customer visibility only; these filters do not select a fiat currency.
    countries: null
