imports:

parameters:
  # Manual bank-transfer funding instructions. No automatic confirmation is implied.
  # Copy to bank_transfer.yaml for local use; the non-example file is Git-ignored.
  # Keep enabled=false until receiving-account details have been reviewed.
  enabled: true
  display_name: Bank transfer
  image_url: /images/payment/bank-transfer.svg
  description: Transfer funds from your bank account.
  filters:
    # Provider-level visibility only; accounts apply their own country filters.
    countries:
      - NG
      - US
  config:
    # Named media.yaml instance for transfer evidence; visibility is deployment-owned.
    media_provider: filesystem
    # Optional country-to-fiat preparation mapping. Accounting remains USD.
    currency_mapping:
      enabled: true
    # Specific transfer guidance; account instructions override this value.
    # This is separate from the opaque fields rendered below.
    instruction: Use the Reference ID as the narration/description for your bank transfer so we can match your payment.
    # All country-eligible accounts are offered as choices; the customer selects one.
    accounts:

      - id: nigeria_ngn
        # Use uppercase ISO country codes. null means unrestricted.
        filters:
          countries:
            - NG
        # Optional account-specific instruction; fields remain completely opaque.
        instruction: Include the funding reference in the Nigeria transfer narration.
        # Ordered opaque fields shown to the customer; keys have no bank semantics.
        fields:
          - key: bank_name
            label: Bank Name
            value: Example Bank Nigeria

          - key: account_name
            label: Account Name
            value: Cliqero Limited

          - key: account_number
            label: Account Number
            value: "0000000000"
            copyable: true

      - id: international_usd
        filters:
          countries: null
        currency_mapping:
          enabled: true
          overrides:
            NG: USD
        fields:
          - key: bank_name
            label: Bank Name
            value: Example International Bank

          - key: account_name
            label: Account Name
            value: Cliqero Limited

          - key: account_number
            label: Account Number
            value: "0000000000"
            copyable: true

          - key: swift
            label: SWIFT / BIC
            value: EXAMPLEX
            copyable: true

          - key: iban
            label: IBAN
            value: XX00EXAMPLE0000000000
            copyable: true

          - key: bank_address
            label: Bank Address
            value: Example address
