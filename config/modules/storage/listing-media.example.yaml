# Selects which configured provider receives new listing images.
# Existing media keeps its persisted provider identity when this changes.
default_provider: filesystem

providers:
  filesystem:
    enabled: true
    # Absolute writable directory outside source control. Required when enabled.
    root: /var/lib/cliqero/listing-media
    # Browser-facing origin served by Cliqero's /media/filesystem route.
    public_base_url: "%env(APP_URL)%/media/filesystem"

  supabase:
    enabled: false
    endpoint: https://project-ref.supabase.co
    bucket: listing-media
    # Sensitive server-side service-role key; use a fake value in this template.
    service_key: supabase_service_role_example

  cloudflare-r2:
    enabled: false
    endpoint: https://account-id.r2.cloudflarestorage.com
    bucket: listing-media
    # Public R2 bucket/custom-domain origin; objects must be browser-readable here.
    public_base_url: https://media.example.com
    access_key_id: r2_access_key_example
    # Sensitive S3-compatible secret. Never commit a real value.
    secret_access_key: r2_secret_key_example
