# Withdrawal methods define reusable destination forms; they never execute payouts.
# Copy this file to config/modules/withdrawal/methods.yaml for local use.
# Real runtime YAML is ignored by Git. Large method files may use the shared
# optional `imports` envelope key to split definitions into smaller YAML files.
parameters:
  # Method IDs are stable application identities. Keep them lowercase and unique.
  methods:
    - id: bank_ng
      enabled: true
      display_name: Bank account
      description: Receive a withdrawal through a Nigerian bank account.

      # null means globally eligible. Otherwise list uppercase ISO alpha-2 codes.
      filters:
        countries:
          - NG

      # Fields are ordered form controls. `name` is the submitted value identity.
      # `copyable` is Cliqero metadata; actual HTML control attributes such as
      # placeholder, autocomplete, rows and data-* belong under `attrs`.
      fields:
        - name: bank_name
          label: Bank
          description: Enter the name of the bank holding this account.
          type: text
          required: true
          copyable: true
          attrs:
            placeholder: Guaranty Trust Bank
            autocomplete: organization
            data-withdrawal-field: bank

        - name: account_number
          label: Account number
          description: Enter the account number that should receive your withdrawal.
          type: text
          required: true
          # regex is enforced by the server. The browser also receives it as an
          # HTML pattern for early feedback, but server validation is authoritative.
          regex: "^[0-9]{10}$"
          copyable: true
          attrs:
            placeholder: "0123456789"
            autocomplete: "off"
            data-withdrawal-field: account-number

        - name: account_name
          label: Account name
          description: Enter the account holder name exactly as registered with the bank.
          type: text
          required: true
          copyable: true
          attrs:
            autocomplete: name

    - id: usdt_trc20
      enabled: true
      display_name: USDT (TRC20)
      description: Receive USDT through the TRON network.
      filters:
        countries: null
      fields:
        - name: address
          label: Wallet address
          description: Enter the USDT wallet address that should receive your withdrawal.
          type: text
          required: true
          regex: "^T[1-9A-HJ-NP-Za-km-z]{33}$"
          copyable: true
          attrs:
            placeholder: T...
            autocomplete: "off"
            data-network: trc20

        # fixed values are shown read-only to customers. Hidden values are
        # injected by the server, omitted from customer forms/lists, and never
        # accepted from client-submitted values. Both remain in snapshots.
        - name: network
          label: Network
          description: Internal network identifier retained for payout processing.
          type: hidden
          value: TRC20
          copyable: true

  # A select uses an ordered array of machine keys and human-facing labels:
  #
  # - name: account_type
  #   label: Account type
  #   type: select
  #   required: true
  #   options:
  #     - key: savings
  #       label: Savings
  #     - key: current
  #       label: Current
  #
  # Text and textarea fields may restrict values with `enum` in addition to
  # server-side `regex` validation:
  #
  # - name: note
  #   label: Payment note
  #   type: textarea
  #   required: false
  #   enum:
  #     - personal
  #     - business
  #   attrs:
  #     placeholder: Optional note
  #     rows: 4
  #     data-purpose: withdrawal-note
  #
  # attrs cannot override Cliqero-owned control properties such as name,
  # type, required, value, id, list or pattern; event-style on* attributes are
  # ignored as well.
