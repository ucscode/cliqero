# Platform referral commission policy for new wallet-paid purchases.
#
# This is deployment configuration, not operational database data. Values are
# whole integer percentages (0..100), not basis points. Level keys must be a
# contiguous YAML mapping beginning at 1; the highest key is the maximum
# payable referral depth. Missing uplines are not redistributed and remain in
# the platform remainder. A total above 100% is rejected during startup.
distribution:
  commission:
    # Use {} or null to deliberately disable referral allocations; the full
    # purchase gross then remains a platform allocation. The levels key itself
    # is required in runtime configuration.
    levels:
      1: 50
      2: 30
      3: 10
