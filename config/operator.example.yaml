parameters:
  # Shared limits for Operator CRUD lists. API routes enforce max_page_size;
  # the browser receives only these validated options for its rows selector.
  tables:
    # Default requested page size for Operator lists.
    default_page_size: 25
    # Hard maximum applied by Operator list endpoints.
    max_page_size: 50
    # Values offered by the shared Operator rows selector.
    page_size_options:
      - 25
      - 50
    # Selection is only enabled on resources that have safe domain operations.
    max_bulk_selection: 100
