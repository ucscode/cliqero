services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cliqero}
      POSTGRES_USER: ${POSTGRES_USER:-cliqero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cliqero-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
