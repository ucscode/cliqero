services:
  postgres:
    image: postgres:17
    entrypoint: ["/bin/bash", "/opt/cliqero/roles/postgres-entrypoint.sh"]
    command: ["postgres"]
    environment:
      CLIQERO_DEPLOYMENT_MODE: production
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/migrations:/opt/cliqero/migrations:ro
      - ../../database/roles:/opt/cliqero/roles:ro
      - ../../database/roles/bootstrap.sql:/docker-entrypoint-initdb.d/001_cliqero_bootstrap.sql:ro

volumes:
  postgres-data:
