services:
  main:
    image: cliqero-main-prod
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cliqero}:${POSTGRES_PASSWORD:-cliqero-local}@postgres:5432/${POSTGRES_DB:-cliqero}
      APP_URL: ${APP_URL:-http://localhost:3000}
      BLOG_DATABASE_PATH: ${BLOG_DATABASE_PATH:-/workspace/data/blog/blog.sqlite}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-cliqero-development-better-auth-secret-change-me-32}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ../../config:/workspace/config:ro
      - ../../config:/app/config:ro
      - blog-data:/workspace/data/blog
      - media-data:/var/lib/cliqero/media

volumes:
  blog-data:
  media-data:
