services:
  main:
    image: cliqero-main-prod
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      BLOG_DATABASE_PATH: ${BLOG_DATABASE_PATH:-/workspace/data/blog/blog.sqlite}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ../../config:/workspace/config:ro
      - ../../config:/app/config:ro
      - type: volume
        source: blog-data
        target: /workspace/data/blog
        volume:
          # In development, /workspace is a bind mount. Do not seed a newly
          # created Blog volume from stale data/blog files beneath that mount.
          nocopy: true
      - media-data:/var/lib/cliqero/media

volumes:
  blog-data:
  media-data:
