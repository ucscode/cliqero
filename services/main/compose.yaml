services:
  main:
    image: cliqero-main-prod
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        APP_URL: ${APP_URL:-}
    environment:
      NODE_ENV: production
      CLIQERO_DEPLOYMENT_MODE: production
      POSTGRES_USER: ${POSTGRES_USER:-}
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-}:${POSTGRES_APP_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-}
      APP_URL: ${APP_URL:-}
      MEDIA_ROOT: ${MEDIA_ROOT:-/var/lib/cliqero/media}
      BLOG_DATABASE_PATH: ${BLOG_DATABASE_PATH:-/workspace/data/blog/blog.sqlite}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      OPENAPI_KEY: ${OPENAPI_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://' + (process.env.HOSTNAME || '127.0.0.1') + ':3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - ../../config:/workspace/config:ro
      - ../../config:/app/config:ro
      - type: volume
        source: blog-data
        target: /workspace/data/blog
        volume:
          # In development, /workspace is a bind mount. Do not seed a newly
          # created Blog volume from stale data/blog files beneath that mount.
          nocopy: true
      - media-data:/var/lib/cliqero/media

volumes:
  blog-data:
  media-data:
