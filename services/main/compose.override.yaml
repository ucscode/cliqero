services:
  main:
    image: cliqero-main-dev
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: development
    command: npm run dev --workspace @cliqero/web -- --hostname 0.0.0.0
    environment:
      NODE_ENV: development
      TUNNEL_URL: ${TUNNEL_URL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cliqero}:${POSTGRES_PASSWORD:-cliqero-local}@postgres:5432/${POSTGRES_DB:-cliqero}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-cliqero-development-better-auth-secret-change-me-32}
    volumes:
      # Mount the repository in development so source, content, package manifests,
      # lockfile, and repository scripts stay live and host-authoritative.
      - ../..:/workspace
      # Explicit Linux-native dependency volumes; update them with `just dev-deps`
      # or `just dev-npm-add` without rebuilding the application image.
      - cliqero-node-modules:/workspace/node_modules
      - cliqero-web-node-modules:/workspace/apps/web/node_modules
      # Keep Next.js dev/build output in a disposable Docker volume instead of
      # creating container-owned files in the host source tree.
      - web-next:/workspace/apps/web/.next

volumes:
  web-next:
  cliqero-node-modules:
  cliqero-web-node-modules:
