services:
  main:
    image: cliqero-main-dev
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: development
    command: npm run dev --workspace @cliqero/web -- --hostname 0.0.0.0
    environment:
      NODE_ENV: development
    volumes:
      # Mount the repository in development so source, content, package manifests,
      # lockfile, and repository scripts stay live and host-authoritative.
      - ../..:/workspace
      # Keep installed dependencies across container recreation without writing
      # Linux container node_modules into the host checkout. npm workspaces may
      # install packages at both the repository root and workspace level, so mask
      # both locations from the host bind mount.
      - node-modules:/workspace/node_modules
      - web-node-modules:/workspace/apps/web/node_modules
      # Keep Next.js dev/build output in a disposable Docker volume instead of
      # creating container-owned files in the host source tree.
      - web-next:/workspace/apps/web/.next

volumes:
  node-modules:
  web-node-modules:
  web-next:
