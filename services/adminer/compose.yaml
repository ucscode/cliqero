services:
  adminer:
    image: shyim/adminerevo:4.8.4
    environment:
      ADMINER_DEFAULT_DRIVER: pgsql
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USER: ${POSTGRES_USER:-cliqero}
      ADMINER_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:-cliqero-local}
      ADMINER_DEFAULT_DB: ${POSTGRES_DB:-cliqero}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
