services:
  outbox-worker:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cliqero}:${POSTGRES_PASSWORD:-cliqero-local}@postgres:5432/${POSTGRES_DB:-cliqero}
      PAYSTACK_CONFIG_PATH: /workspace/config/modules/payment/paystack.yaml
      PAYSTACK_SECRETS_PATH: /workspace/config/secrets/payment/paystack.yaml
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
      OUTBOX_STALE_AFTER_MS: ${OUTBOX_STALE_AFTER_MS:-300000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

