services:
  outbox-worker:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-cliqero-development-better-auth-secret-change-me-32}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cliqero}:${POSTGRES_PASSWORD:-cliqero-local}@postgres:5432/${POSTGRES_DB:-cliqero}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
      OUTBOX_STALE_AFTER_MS: ${OUTBOX_STALE_AFTER_MS:-300000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ../../config:/workspace/config:ro
      - listing-media-data:/var/lib/cliqero/listing-media

volumes:
  listing-media-data:
