services:
  outbox-worker:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      CLIQERO_DEPLOYMENT_MODE: production
      POSTGRES_USER: ${POSTGRES_USER:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-}:${POSTGRES_APP_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
      OUTBOX_STALE_AFTER_MS: ${OUTBOX_STALE_AFTER_MS:-300000}
      OUTBOX_RETRY_BASE_MS: ${OUTBOX_RETRY_BASE_MS:-1000}
      OUTBOX_RETRY_MAX_MS: ${OUTBOX_RETRY_MAX_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ../../config:/workspace/config:ro
      - media-data:/var/lib/cliqero/media

volumes:
  media-data:
