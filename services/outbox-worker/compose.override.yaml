services:
  outbox-worker:
    command: npm run worker:outbox:watch --workspace @cliqero/web
    environment:
      NODE_ENV: development
      CLIQERO_DEPLOYMENT_MODE: development
      APP_URL: ${APP_URL:-http://localhost:3000}
      TUNNEL_URL: ${TUNNEL_URL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cliqero}:${POSTGRES_PASSWORD:-cliqero-local}@postgres:5432/${POSTGRES_DB:-cliqero}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-cliqero-development-better-auth-secret-change-me-32}
    volumes:
      # Keep worker source and local configuration live during development.
      - ../..:/workspace
      # Keep Linux-native dependencies service-local. Docker must not copy the
      # same image dependency trees into shared, nested volumes concurrently
      # when main and outbox-worker are first created together.
      - outbox-worker-node-modules:/workspace/node_modules
      - outbox-worker-web-node-modules:/workspace/apps/web/node_modules

volumes:
  outbox-worker-node-modules:
  outbox-worker-web-node-modules:
