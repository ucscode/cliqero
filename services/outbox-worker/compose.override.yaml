services:
  outbox-worker:
    command: npm run worker:outbox:watch --workspace @cliqero/web
    environment:
      NODE_ENV: development
      CLIQERO_DEPLOYMENT_MODE: development
      TUNNEL_URL: ${TUNNEL_URL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cliqero}:${POSTGRES_PASSWORD:-cliqero-local}@postgres:5432/${POSTGRES_DB:-cliqero}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-cliqero-development-better-auth-secret-change-me-32}
    volumes:
      # Keep worker source and local configuration live during development.
      - ../..:/workspace
      # Share explicit Linux-native dependency volumes with the main service.
      - cliqero-node-modules:/workspace/node_modules
      - cliqero-web-node-modules:/workspace/apps/web/node_modules
